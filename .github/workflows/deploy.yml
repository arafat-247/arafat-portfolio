name: Refresh portfolio and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build verified author archive
        run: python scripts/update_articles.py --pages 60

      - name: Verify clean local archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("site/data/articles.json").read_text(encoding="utf-8"))
          articles = data.get("articles", [])

          if not articles:
              raise SystemExit("No stories in generated archive.")

          bad = [a.get("title","") for a in articles if a.get("verified_author") is not True]
          if bad:
              raise SystemExit(f"Unverified stories present: {bad[:5]}")

          external_cards = [a.get("title","") for a in articles if not a.get("local_url")]
          if external_cards:
              raise SystemExit(f"Stories missing local URLs: {external_cards[:5]}")

          missing = []
          for a in articles:
              page = Path("site") / a["local_url"] / "index.html"
              if not page.exists():
                  missing.append(str(page))

          if missing:
              raise SystemExit("Missing local story pages:\n" + "\n".join(missing[:10]))

          print(
              f"Verified clean build: {len(articles)} author stories; "
              f"{data.get('non_author_urls_rejected', 0)} unrelated candidates rejected."
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
