name: Build Windows assistant

on:
  pull_request:
    paths:
      - 'assistant/**'
      - 'site/assistant/**'
      - '.github/workflows/assistant-build.yml'
  push:
    branches: [main]
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: 'qwen3:1.7b'
            label: light
          - model: 'qwen3:4b'
            label: standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked Ollama engine for CPU verification
        env:
          OLLAMA_ARCHIVE: ${{ runner.temp }}/ollama.tar.zst
        run: |
          curl -fL --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-linux-amd64.tar.zst -o "$OLLAMA_ARCHIVE"
          python - <<'PY'
          import hashlib, os
          with open(os.environ['OLLAMA_ARCHIVE'], 'rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == 'c9490e0f520be21271d969e6703f012268b1d39f8b70dd58854e5bfef7a75bb6', actual
          PY
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$OLLAMA_ARCHIVE" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Check real local model actions and Bangla replies
        run: python assistant/desktop/live_local_check.py --model '${{ matrix.model }}' --report 'local-check-${{ matrix.label }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-model-${{ matrix.label }}
          path: local-check-${{ matrix.label }}.json
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            assistant/desktop/requirements.txt
            assistant/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r assistant/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check download release selection
        run: node --test assistant/test_download_page.mjs
      - name: Check source against installed Microsoft Edge
        run: python assistant/build_windows.py --stage check
      - name: Build portable Windows executable
        run: python assistant/build_windows.py --stage freeze
      - name: Check the packaged browser and desktop interface
        timeout-minutes: 3
        run: python assistant/build_windows.py --stage smoke
      - name: Package checked app and checksum
        run: python assistant/build_windows.py --stage package
      - name: Report packaged startup check
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'assistant/dist/ArafatAssistant/SMOKE_TEST.json') {
            Get-Content -Raw 'assistant/dist/ArafatAssistant/SMOKE_TEST.json'
          }
          if (Test-Path 'assistant/dist/ArafatAssistant/SMOKE_TEST.json.trace.txt') {
            Get-Content -Raw 'assistant/dist/ArafatAssistant/SMOKE_TEST.json.trace.txt'
          }
      - name: Retain packaged app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ArafatAssistant-Windows-x64
          path: assistant/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaged smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-smoke-report
          path: assistant/dist/ArafatAssistant/SMOKE_TEST.json*
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [windows, local-model]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArafatAssistant-Windows-x64
          path: release
      - name: Publish tested preview download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSISTANT_COMMIT: ${{ github.sha }}
          ASSISTANT_RUN: ${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.txt <<'NOTES'
          Portable Windows preview of Arafat Assistant, including Python. Microsoft Edge is required.
          Extract the ZIP and open Start Local Assistant.cmd (or choose Local model in the main window).
          Open Local setup, install Ollama once, and download the Light or Standard Qwen3 model.
          Local mode uses a model on your PC: no OpenAI sign-in, subscription or API credit is required.
          The assistant owns a loopback-only Ollama engine with cloud features disabled.
          Existing browser, Windows app, note, voice-review and action-approval controls remain available.
          The packaged import, browser and desktop-interface smoke checks passed.
          Both starter models passed real CPU model/tool/Bangla checks on Linux. Windows checks exercised actual Notepad read/fill controls.
          Your PC's inference speed, microphone, speech recognition and individual apps still need local testing.
          Optional ChatGPT mode remains subject to account/workspace eligibility. Its sign-in restriction is not changed by this update.
          Voice is transcribed locally after a first-use multilingual model download.
          Optional API mode is billed separately and never used as an automatic fallback.
          This is an unsigned preview; keep Windows security protections enabled.
          NOTES
          gh release create "assistant-v0.4.${ASSISTANT_RUN}" release/* \
            --target "$ASSISTANT_COMMIT" --prerelease --latest=false \
            --title "Arafat Assistant local Windows preview 0.4.${ASSISTANT_RUN}" \
            --notes-file release-notes.txt
