name: Build Windows assistant

on:
  pull_request:
    paths:
      - 'assistant/**'
      - 'site/assistant/**'
      - '.github/workflows/assistant-build.yml'
  push:
    branches: [main]
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            assistant/desktop/requirements.txt
            assistant/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r assistant/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check download release selection
        run: node --test assistant/test_download_page.mjs
      - name: Check source against installed Microsoft Edge
        run: python assistant/build_windows.py --stage check
      - name: Build portable Windows executable
        run: python assistant/build_windows.py --stage freeze
      - name: Check the packaged browser and desktop interface
        timeout-minutes: 3
        run: python assistant/build_windows.py --stage smoke
      - name: Package checked app and checksum
        run: python assistant/build_windows.py --stage package
      - name: Report packaged startup check
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'assistant/dist/ArafatAssistant/SMOKE_TEST.json') {
            Get-Content -Raw 'assistant/dist/ArafatAssistant/SMOKE_TEST.json'
          }
      - name: Retain packaged app and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ArafatAssistant-Windows-x64
          path: assistant/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaged smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-smoke-report
          path: assistant/dist/ArafatAssistant/SMOKE_TEST.json
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArafatAssistant-Windows-x64
          path: release
      - name: Publish tested preview download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSISTANT_COMMIT: ${{ github.sha }}
          ASSISTANT_RUN: ${{ github.run_number }}
        shell: bash
        run: |
          cat > release-notes.txt <<'NOTES'
          Portable Windows preview of Arafat Assistant, including Python. Microsoft Edge is required.
          Extract the ZIP, open ArafatAssistant.exe, and select Continue with ChatGPT.
          Sign in with your eligible personal Plus / Pro account and allow Use your ChatGPT plan.
          The packaged import, browser and desktop-interface smoke checks passed.
          Live ChatGPT sign-in, microphone capture, local speech recognition and installed-app actions require local testing.
          ChatGPT mode uses your existing plan allowance, subject to eligibility and usage limits. No API key is needed in that mode.
          Voice is transcribed locally after a first-use multilingual model download.
          Optional API mode is billed separately and never used as an automatic fallback.
          This is an unsigned preview; keep Windows security protections enabled.
          NOTES
          gh release create "assistant-v0.3.${ASSISTANT_RUN}" release/* \
            --target "$ASSISTANT_COMMIT" --prerelease --latest=false \
            --title "Arafat Assistant Windows preview 0.3.${ASSISTANT_RUN}" \
            --notes-file release-notes.txt
