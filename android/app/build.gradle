plugins { id 'com.android.application' }
android {
    namespace 'com.arafat.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arafat.assistant'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    lint { abortOnError true; disable 'HardcodedText', 'SetTextI18n', 'RtlHardcoded', 'Autofill', 'ObsoleteSdkInt', 'OldTargetApi' }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
